<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<title>Khulna CCTV</title>
<style>
  :root {
    --bg: #0d1117; --panel: #161b22; --line: #2a313c; --text: #e6edf3; --muted: #8b949e;
    --accent: #3fb950; --warn: #d29922; --bad: #f85149; --blue: #58a6ff; --motion: #ff7b72;
    --r: 12px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif; }
  body { display: flex; flex-direction: column; padding-bottom: env(safe-area-inset-bottom); }
  button { font: inherit; color: inherit; cursor: pointer; }
  code { background: var(--bg); padding: 1px 5px; border-radius: 5px; }

  header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; position: relative;
    padding-top: max(10px, env(safe-area-inset-top)); border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; font-weight: 650; white-space: nowrap; }
  .tabs { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-left: auto; }
  .tabs button { border: 0; background: none; padding: 6px 12px; border-radius: 8px; color: var(--muted); white-space: nowrap; }
  .tabs button.on { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .me, .langbtn { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 6px 10px; font-size: 13px;
    display: flex; gap: 6px; align-items: center; white-space: nowrap; }
  .langbtn { font-weight: 600; min-width: 42px; justify-content: center; }
  .role { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #1f6feb33; color: var(--blue); }
  .role.admin { background: #3fb95033; color: var(--accent); }
  @media (max-width: 600px) {
    header { gap: 5px; padding-left: 8px; padding-right: 8px; }
    header h1 { font-size: 0; } header h1::first-letter { font-size: 20px; }
    .tabs { margin-left: 0; } .tabs button { padding: 6px 8px; font-size: 13.5px; }
    .me { margin-left: auto; padding: 6px 8px; } #meRole { display: none; }
    .langbtn { padding: 6px 7px; min-width: 0; }
  }

  .statusbar { display: flex; gap: 8px; flex-wrap: wrap; padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 3px 9px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--line); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.ok { background: var(--accent); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }

  .chips { display: flex; gap: 8px; padding: 0 12px 8px; overflow-x: auto; scrollbar-width: none; }
  .chip { display: inline-flex; align-items: center; gap: 7px; padding: 6px 12px; border-radius: 99px; white-space: nowrap;
    border: 1px solid var(--line); background: var(--panel); }
  .chip .sw { width: 28px; height: 16px; border-radius: 99px; background: #30363d; position: relative; transition: .2s; }
  .chip .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%;
    background: #fff; transition: .2s; }
  .chip.on .sw { background: var(--accent); } .chip.on .sw::after { left: 14px; }
  .chip:not(.on) { color: var(--muted); }

  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  #live { flex: 1; min-height: 0; padding: 0 8px 8px; }
  .grid { height: 100%; display: grid; gap: 6px; grid-template-columns: 1fr; grid-auto-rows: 1fr; }
  .grid.n3, .grid.n4 { grid-template-columns: 1fr 1fr; }
  @media (orientation: landscape) { .grid.n2 { grid-template-columns: 1fr 1fr; } }
  @media (orientation: portrait) and (max-width: 700px) {
    .grid { height: auto; grid-auto-rows: auto; }
    .grid .tile { aspect-ratio: 16 / 9; }
  }
  .grid.focus { grid-template-columns: 1fr !important; height: 100%; grid-auto-rows: 1fr; }
  .grid.focus .tile:not(.big) { display: none; }
  .grid.focus .tile.big { aspect-ratio: auto; }

  .tile { position: relative; background: #000; border-radius: var(--r); overflow: hidden; min-height: 0; border: 1px solid var(--line); }
  .tile.moving { border-color: var(--motion); box-shadow: 0 0 0 1px var(--motion) inset; }
  .tile video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
  .tile .label { position: absolute; left: 8px; top: 8px; display: flex; align-items: center; gap: 6px; max-width: calc(100% - 150px);
    padding: 3px 8px; border-radius: 8px; background: rgba(0,0,0,.55); font-size: 13px; backdrop-filter: blur(4px); }
  .tile .label .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile .mbadge { position: absolute; left: 8px; bottom: 8px; display: none; padding: 2px 8px; border-radius: 8px;
    background: var(--motion); color: #200; font-size: 12px; font-weight: 700; }
  .tile.moving .mbadge { display: block; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .55; } }
  .tile .tools { position: absolute; right: 6px; top: 6px; display: flex; gap: 5px; }
  .tile .tools button { border: 0; background: rgba(0,0,0,.55); border-radius: 8px; padding: 4px 8px; font-size: 12.5px;
    backdrop-filter: blur(4px); min-width: 30px; }
  .tile .tools button.on { color: var(--blue); }
  .tile .msg { position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 14px;
    pointer-events: none; text-align: center; padding: 10px; }
  .ptz { position: absolute; right: 10px; bottom: 10px; width: 132px; height: 132px; display: none;
    grid-template: repeat(3, 1fr) / repeat(3, 1fr); gap: 3px; }
  .tile.ptzon .ptz { display: grid; }
  .ptz button { border: 0; border-radius: 10px; background: rgba(0,0,0,.6); color: #fff; font-size: 18px;
    backdrop-filter: blur(4px); touch-action: none; user-select: none; -webkit-user-select: none; }
  .ptz button:active, .ptz button.press { background: rgba(63,185,80,.75); }
  .ptz .c { background: transparent; pointer-events: none; }
  @media (max-width: 500px) {
    .tile .label { font-size: 12px; padding: 2px 6px; left: 5px; top: 5px; max-width: calc(100% - 135px); }
    .tile .tools { top: 4px; right: 4px; gap: 3px; } .tile .tools button { padding: 3px 6px; min-width: 26px; }
    .ptz { width: 108px; height: 108px; }
  }
  .empty { height: 100%; display: grid; place-items: center; color: var(--muted); text-align: center; padding: 30px; }

  /* ---- recordings / timeline ---- */
  #recs { flex: 1; overflow: auto; padding: 0 12px 24px; display: none; }
  .row { display: flex; gap: 6px; align-items: center; margin: 4px 0 10px; }
  .row select { min-width: 0; flex: 1 1 auto; } .row #recCam { flex: 2 1 0; }
  select { font: inherit; color: var(--text); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
  .navbtn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 11px; }
  .player { position: relative; background: #000; border-radius: var(--r); overflow: hidden; border: 1px solid var(--line); }
  .player video { width: 100%; max-height: 62vh; display: block; background: #000; aspect-ratio: 16 / 9; }
  .pbar { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; background: var(--panel); font-size: 13.5px; flex-wrap: wrap; }
  .pbar b { font-variant-numeric: tabular-nums; font-size: 15px; }
  .pbar a, .pbar button { color: var(--blue); background: none; border: 0; text-decoration: none; padding: 2px 4px; }
  .day { position: relative; height: 46px; margin: 14px 0 4px; background: #0b0f14; border: 1px solid var(--line);
    border-radius: 10px; overflow: hidden; cursor: pointer; touch-action: pan-y; }
  .day .seg { position: absolute; top: 8px; bottom: 8px; background: #3b4552; }
  .day .ev { position: absolute; top: 4px; bottom: 4px; background: var(--motion); border-radius: 2px; min-width: 2px; opacity: .95; }
  .day .cur { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--blue); box-shadow: 0 0 6px var(--blue); }
  .day .now { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--warn); opacity: .7; }
  .day .hov { position: absolute; top: -1px; transform: translateX(-50%); font-size: 11px; background: var(--panel);
    padding: 0 4px; border-radius: 4px; pointer-events: none; display: none; }
  .hours { position: relative; height: 16px; font-size: 10.5px; color: var(--muted); }
  .hours span { position: absolute; transform: translateX(-50%); }
  .legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--muted); margin: 4px 0 8px; }
  .legend i { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: 5px; vertical-align: middle; }
  .strip { display: flex; gap: 6px; overflow-x: auto; padding: 4px 0 10px; scroll-behavior: smooth; }
  .thumb { flex: none; width: 112px; border: 2px solid transparent; border-radius: 8px; overflow: hidden; background: var(--panel);
    padding: 0; position: relative; }
  .thumb img, .thumb .ph { width: 100%; aspect-ratio: 16 / 9; display: block; object-fit: cover; background: #222a33; }
  .thumb span { display: block; font-size: 11.5px; padding: 2px 4px; color: var(--muted); text-align: left; font-variant-numeric: tabular-nums; }
  .thumb.m { border-color: var(--motion); } .thumb.m span { color: var(--motion); }
  .thumb.sel { box-shadow: 0 0 0 2px var(--blue); }
  .hourpick { display: flex; gap: 4px; overflow-x: auto; padding: 2px 0 6px; }
  .hourpick button { flex: none; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 4px 8px; font-size: 12.5px; color: var(--muted); }
  .hourpick button.has { color: var(--text); } .hourpick button.mot { border-color: var(--motion); }
  .hourpick button.on { background: var(--blue); color: #001; border-color: var(--blue); }
  .evs { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
  .evc { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; overflow: hidden; padding: 0; text-align: left; }
  .evc img, .evc .ph { width: 100%; aspect-ratio: 16 / 9; object-fit: cover; display: block; background: #222a33; }
  .evc div { padding: 6px 8px; font-size: 12.5px; } .evc b { color: var(--motion); font-variant-numeric: tabular-nums; }
  .sect { font-size: 12.5px; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); margin: 18px 2px 8px; }
  .muted { color: var(--muted); }

  /* ---- forms / settings ---- */
  #login { position: fixed; inset: 0; z-index: 50; display: none; place-items: center; background: var(--bg); padding: 20px; }
  .card { width: min(380px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 16px; padding: 22px; }
  .card h2 { margin: 0 0 4px; font-size: 20px; }
  .card p { margin: 0 0 16px; color: var(--muted); font-size: 14px; }
  label.f { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  input[type=text], input[type=password], input[type=number] { width: 100%; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  input:focus, select:focus { outline: 2px solid var(--blue); outline-offset: -1px; }
  .btn { border: 0; border-radius: 10px; padding: 10px 14px; background: var(--accent); color: #04140a; font-weight: 600; }
  .btn.full { width: 100%; margin-top: 16px; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--line); font-weight: 500; }
  .btn.danger { background: transparent; color: var(--bad); border: 1px solid #5c2a2a; font-weight: 500; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 8px; }
  #users { flex: 1; overflow: auto; padding: 0 12px 24px; display: none; }
  .ulist { display: grid; gap: 8px; margin-bottom: 14px; }
  .urow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 12px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
  .urow small { display: block; color: var(--muted); font-size: 12px; margin-top: 2px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
  .checks label { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; }
  .seg2 { display: inline-flex; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
  .seg2 button { border: 0; background: none; padding: 6px 14px; border-radius: 8px; color: var(--muted); }
  .seg2 button.on { background: var(--panel); color: var(--text); box-shadow: 0 0 0 1px var(--line); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; } .grid2 > div { min-width: 0; }
  .card select { width: 100%; }
  .hint { font-size: 12.5px; color: var(--warn); margin-top: 6px; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  .linkbtn { border: 0; background: none; color: var(--blue); padding: 8px 0 2px; font-size: 13.5px; }
  .tres { margin-top: 12px; font-size: 13.5px; display: grid; gap: 4px; }
  .tres .ok { color: var(--accent); } .tres .no { color: var(--bad); }
  .tag { font-size: 11px; padding: 1px 6px; border-radius: 6px; background: #30363d; color: var(--muted); margin-left: 4px; }
  .tag.rec { background: #3fb95022; color: var(--accent); } .tag.bad { background: #f8514922; color: var(--bad); }
  .pick { display: grid; gap: 6px; margin-top: 8px; }
  .pick button { text-align: left; border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
  .banner { margin: 0 0 10px; padding: 10px 12px; border-radius: 10px; background: #1f6feb22; border: 1px solid #1f6feb55; font-size: 14px; display: none; }
  .menu { position: absolute; right: 12px; top: 54px; z-index: 40; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 6px; display: none; min-width: 200px; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  .menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 9px 10px; border-radius: 8px; }
  .menu button:hover { background: var(--bg); }
  dialog { border: 0; padding: 0; background: transparent; color: var(--text); }
  dialog::backdrop { background: rgba(0,0,0,.75); }
  .loginlang { position: absolute; top: 16px; right: 16px; }
  .bar { height: 8px; border-radius: 99px; background: #30363d; overflow: hidden; margin: 2px 0 8px; }
  .bar i { display: block; height: 100%; background: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>📹 <span data-t="title"></span></h1>
  <div class="tabs">
    <button id="tabLive" class="on" data-t="live"></button>
    <button id="tabRecs" data-t="recordings"></button>
    <button id="tabUsers" style="display:none" data-t="settings"></button>
  </div>
  <button class="me" id="meBtn"><span id="meName"></span><span class="role" id="meRole"></span></button>
  <button class="langbtn" id="langBtn"></button>
</header>
<div class="menu" id="menu">
  <button id="mApp" style="display:none" data-t="appServer"></button>
  <button id="mUpd" style="display:none" data-t="updateNow"></button>
  <button id="mPass" data-t="changePass"></button>
  <button id="mLogout" data-t="logout"></button>
</div>

<div id="login">
  <button class="langbtn loginlang" id="langBtn2"></button>
  <form class="card" id="loginForm" autocomplete="on">
    <h2>📹 <span data-t="title"></span></h2>
    <p id="loginHint"></p>
    <label class="f" for="lu" data-t="username"></label>
    <input type="text" id="lu" autocomplete="username" autocapitalize="none" required>
    <label class="f" for="lp" data-t="password"></label>
    <input type="password" id="lp" autocomplete="current-password" required>
    <button class="btn full" type="submit" data-t="login"></button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<div class="statusbar">
  <button class="pill" id="stStorage" style="cursor:pointer;color:inherit;font:inherit"><span class="dot"></span><span>…</span></button>
  <span class="pill" id="stDrive"><span class="dot"></span><span>…</span></span>
  <span class="pill" id="stLoad"><span class="dot"></span><span>…</span></span>
</div>

<main>
  <section id="liveWrap" style="display:contents">
    <div class="chips" id="chips"></div>
    <div id="live"><div class="grid" id="grid"></div></div>
  </section>

  <section id="recs">
    <div class="row">
      <select id="recCam"></select>
      <button class="navbtn" id="dPrev">◀</button>
      <select id="recDate"></select>
      <button class="navbtn" id="dNext">▶</button>
    </div>
    <div class="player">
      <video id="pv" controls playsinline preload="metadata"></video>
      <div class="pbar">
        <span><b id="pvTime">--:--:--</b> <span class="muted" id="pvInfo"></span></span>
        <span><button id="pvPrev">⏮ <span data-t="prevMin"></span></button><button id="pvNext"><span data-t="nextMin"></span> ⏭</button>
          <a id="pvDl" download data-t="download"></a></span>
      </div>
    </div>
    <div class="day" id="day"><div class="hov" id="hov"></div></div>
    <div class="hours" id="hours"></div>
    <div class="legend"><span><i style="background:#3b4552"></i><span data-t="lgRec"></span></span>
      <span><i style="background:var(--motion)"></i><span data-t="lgMotion"></span></span>
      <span><i style="background:var(--blue)"></i><span data-t="lgNow"></span></span></div>
    <div class="hourpick" id="hourpick"></div>
    <div class="strip" id="strip"></div>
    <div class="sect"><span data-t="motionEvents"></span> <span id="evCount" class="muted"></span></div>
    <div class="evs" id="evs"></div>
  </section>

  <section id="users">
    <div class="banner" id="applyBanner"></div>
    <div class="sect">📷 <span data-t="cameras"></span></div>
    <div class="ulist" id="clist"></div>
    <form class="card" id="cForm" style="width:100%;max-width:540px" autocomplete="off">
      <h2 id="cFormTitle"></h2>
      <p data-t="camFormSub"></p>
      <label class="f" data-t="name"></label>
      <input type="text" id="cName" required>
      <label class="f" data-t="brand"></label>
      <select id="cType"></select>
      <div class="hint" id="cHint"></div>
      <div class="grid2">
        <div><label class="f" data-t="ip"></label><input type="text" id="cHost" inputmode="decimal" placeholder="192.168.0.100" required></div>
        <div><label class="f" data-t="rtspPort"></label><input type="number" id="cPort" value="554"></div>
      </div>
      <div class="grid2">
        <div><label class="f" data-t="username"></label><input type="text" id="cUser" autocapitalize="none"></div>
        <div><label class="f" data-t="password"></label><input type="password" id="cPass" autocomplete="new-password"></div>
      </div>
      <button type="button" class="linkbtn" id="cOnvif" data-t="findOnvif"></button>
      <div class="pick" id="cPick"></div>
      <label class="f" data-t="mainPath"></label>
      <input type="text" id="cMain" placeholder="/...">
      <label class="f" data-t="subPath"></label>
      <input type="text" id="cSub" placeholder="/...">
      <div class="grid2">
        <div><label class="f" data-t="recording"></label>
          <select id="cMode"><option value="continuous" data-t="mode247"></option><option value="motion" data-t="modeMotion"></option><option value="off" data-t="modeOff"></option></select></div>
        <div><label class="f" data-t="recQuality"></label>
          <select id="cRec"><option value="main" data-t="qMain"></option><option value="sub" data-t="qSub"></option></select></div>
      </div>
      <div class="grid2">
        <div><label class="f" data-t="sensitivity"></label><input type="number" id="cThr" value="1500" min="100" step="100"></div>
        <div><label class="f" data-t="options"></label>
          <div class="checks" style="margin-top:4px">
            <label><input type="checkbox" id="cEn" checked> <span data-t="enabled"></span></label>
            <label><input type="checkbox" id="cAud" checked> <span data-t="sound"></span></label>
            <label><input type="checkbox" id="cPtz"> <span data-t="ptzCap"></span></label>
          </div></div>
      </div>
      <div class="btnrow">
        <button class="btn ghost" type="button" id="cTest">▶ <span data-t="test"></span></button>
        <button class="btn" type="submit" data-t="save"></button>
        <button class="btn danger" type="button" id="cDel" style="display:none" data-t="delete"></button>
        <button class="btn ghost" type="button" id="cNew" data-t="new"></button>
      </div>
      <div class="tres" id="cRes"></div>
      <div class="err" id="cErr"></div>
    </form>

    <div class="sect">☁️ Google Drive</div>
    <div class="card" style="width:100%;max-width:540px">
      <div id="drvState" class="muted">…</div>
      <div id="drvSteps" style="display:none">
        <ol style="padding-left:18px;margin:10px 0;font-size:14px;line-height:1.6">
          <li data-t="drv1"></li><li data-t="drv2"></li><li data-t="drv3"></li>
        </ol>
        <a class="btn" id="drvGo" target="_blank" rel="noopener" style="display:inline-block;text-decoration:none" data-t="drvLogin"></a>
        <label class="f" data-t="drvPaste"></label>
        <input type="text" id="drvUrl" placeholder="http://127.0.0.1:53682/?state=…&code=…" autocapitalize="none">
        <div class="btnrow"><button class="btn" type="button" id="drvFinish" data-t="drvFinish"></button></div>
      </div>

function t(key, ...args) {
  const v = I18N[key]; if (!v) return key;
  let s = v[LANG === "bn" ? 1 : 0];
  if (typeof s === "string") args.forEach((a, i) => { s = s.replaceAll(`{${i}}`, a); });
  return s;
}
const tr = msg => { const p = String(msg ?? "").split(" || "); return p.length > 1 && LANG === "bn" ? p[1] : p[0]; };
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-t]").forEach(el => { el.innerHTML = t(el.dataset.t); });
  for (const b of [$("#langBtn"), $("#langBtn2")]) b.textContent = LANG === "bn" ? "EN" : "বাং";
  document.title = t("title");
}
function setLang(l) {
  LANG = l; LS.set("cctv.lang", l); applyLang();
  if ($("#login").style.display === "grid") showLogin();
  if (ME) { api("/api/prefs", { lang: l }).catch(() => {}); rerenderAll(); }
}
$("#langBtn").onclick = $("#langBtn2").onclick = () => setLang(LANG === "bn" ? "en" : "bn");

/* =============================== api =============================== */
async function api(path, body) {
  const opts = { cache: "no-store", credentials: "same-origin", headers: { "X-Lang": LANG } };
  if (body !== undefined) {
    opts.method = "POST";
    Object.assign(opts.headers, { "Content-Type": "application/json", "X-Requested-With": "cctv" });
    opts.body = JSON.stringify(body);
  }
  const r = await fetch(path, opts);
  let data = null; try { data = await r.json(); } catch {}
  if (r.status === 401 && path !== "/api/login" && path !== "/api/me") { showLogin(); throw new Error("login"); }
  if (!r.ok) throw new Error(tr((data && data.error) || "Error " + r.status));
  return data;
}

/* ====================== live player (go2rtc MSE) ======================
 * send {"type":"mse","value":"<codecs>"} -> {"type":"mse","value":"video/mp4; codecs=..."} -> binary fMP4 */
const VCODECS = ["avc1.640029", "avc1.64002A", "avc1.640033", "hvc1.1.6.L153.B0"];
const ACODECS = ["mp4a.40.2", "mp4a.40.5", "flac", "opus"];
const MSClass = window.ManagedMediaSource || window.MediaSource;

class LivePlayer {
  constructor(video, onState) { this.video = video; this.onState = onState; this.stopped = true; this.retry = 0; }
  play(src, audio) { this.stop(); this.src = src; this.audio = !!audio; this.stopped = false; this.connect(); }
  stop() {
    this.stopped = true; clearTimeout(this.timer); clearInterval(this.watch);
    if (this.ws) { this.ws.onclose = null; try { this.ws.close(); } catch {} this.ws = null; }
    if (this.video.srcObject) this.video.srcObject = null;
    if (this.video.getAttribute("src")) { URL.revokeObjectURL(this.video.src); this.video.removeAttribute("src"); this.video.load(); }
    this.ms = this.sb = null; this.queue = [];
  }
  reconnect(key) {
    if (this.stopped) return;
    this.onState("wait", t(key));
    const { src, audio } = this; this.stop(); Object.assign(this, { src, audio, stopped: false });
    this.timer = setTimeout(() => this.connect(), Math.min(15000, 1000 * 2 ** this.retry++));
  }
  connect() {
    if (!MSClass) { this.onState("bad", t("noMSE")); return; }
    this.onState("wait", t("connecting"));
    this.queue = []; this.lastData = Date.now();
    const ms = this.ms = new MSClass();
    if (window.ManagedMediaSource) this.video.disableRemotePlayback = true;
    ms.addEventListener("sourceopen", () => this.openWs(ms), { once: true });
    if (window.ManagedMediaSource && MSClass === window.ManagedMediaSource) this.video.srcObject = ms;
    else this.video.src = URL.createObjectURL(ms);
    this.video.muted = !this.audio; this.video.playsInline = true; this.video.autoplay = true;
  }
  openWs(ms) {
    if (this.stopped || ms !== this.ms) return;
    const url = new URL("/api/ws?src=" + encodeURIComponent(this.src), location.href);
    url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
    const ws = this.ws = new WebSocket(url); ws.binaryType = "arraybuffer";
    ws.onopen = () => {
      const list = this.audio ? [...VCODECS, ...ACODECS] : VCODECS;
      ws.send(JSON.stringify({ type: "mse", value: list.filter(c => MSClass.isTypeSupported(`video/mp4; codecs="${c}"`)).join() }));
    };
    ws.onmessage = ev => {
      this.lastData = Date.now();
      if (typeof ev.data === "string") {
        let msg; try { msg = JSON.parse(ev.data); } catch { return; }
        if (msg.type === "mse") this.initSb(msg.value);
        else if (msg.type === "error") this.reconnect("camLost");
        return;
      }
      this.append(ev.data);
    };
    ws.onclose = () => this.reconnect("connLost");
    clearInterval(this.watch);
    this.watch = setInterval(() => { if (Date.now() - this.lastData > 12000) this.reconnect("streamStopped"); }, 4000);
  }
  initSb(type) {
    try { const sb = this.sb = this.ms.addSourceBuffer(type); sb.mode = "segments"; sb.addEventListener("updateend", () => this.pump()); }
    catch { this.onState("bad", t("noCodec")); this.stopped = true; }
  }
  append(buf) { if (!this.sb) return; this.queue.push(buf); if (this.queue.length > 50) this.queue.splice(0, this.queue.length - 50); this.pump(); }
  pump() {
    const sb = this.sb, v = this.video;
    if (!sb || sb.updating) return;
    try {
      const b = sb.buffered;
      if (b.length) {
        const start = b.start(0), end = b.end(b.length - 1);
        if (end - v.currentTime > 2.5 || v.currentTime < start) v.currentTime = Math.max(start, end - 0.4);
        if (v.currentTime - start > 30) { sb.remove(start, v.currentTime - 10); return; }
      }
      if (this.queue.length) {
        const parts = this.queue.splice(0), size = parts.reduce((n, p) => n + p.byteLength, 0);
        const data = new Uint8Array(size); let off = 0;
        for (const p of parts) { data.set(new Uint8Array(p), off); off += p.byteLength; }
        sb.appendBuffer(data);
      }
      if (v.paused && b.length) v.play().catch(() => { if (!v.muted) { v.muted = true; v.play().catch(() => {}); } });
      if (b.length) { this.retry = 0; this.onState("ok", ""); }
    } catch (e) { if (e.name === "QuotaExceededError") this.queue = []; else this.reconnect("connLost"); }
  }
}

function ptzSend(cam, body) { return api("/api/ptz", Object.assign({ cam }, body)).catch(e => { if (e.message !== "login") alert(e.message); throw e; }); }

function makeTile(c) {
  const el = document.createElement("div");

    <div class="label"><span class="dot"></span><span class="nm"></span></div>
    <div class="mbadge"></div>

    <div class="msg"></div>

      <button data-x="-1" data-y="0">◀</button><span class="c"></span><button data-x="1" data-y="0">▶</button>
      <span class="c"></span><button data-x="0" data-y="-1">▼</button><span class="c"></span>

  el.querySelector(".nm").textContent = c.name;
  const video = el.querySelector("video"), dot = el.querySelector(".label .dot"), msg = el.querySelector(".msg");

  const qBtn = el.querySelector(".q"), sBtn = el.querySelector(".snd"), pBtn = el.querySelector(".pz");
  const sync = () => {
    qBtn.textContent = T.hd ? "HD" : "SD"; qBtn.classList.toggle("on", T.hd);
    sBtn.textContent = T.audio ? "🔊" : "🔇"; sBtn.classList.toggle("on", T.audio); sBtn.title = t("soundOn");
    pBtn.title = t("ptzBtn"); el.querySelector(".mbadge").textContent = t("motion");
  };
  T.sync = sync; sync();
  T.start = () => T.player.play(T.hd ? c.id : c.id + "_sub", T.audio);
  qBtn.onclick = e => { e.stopPropagation(); T.hd = !T.hd; LS.set("cctv.hd." + c.id, T.hd); sync(); T.start(); };
  sBtn.onclick = e => { e.stopPropagation(); T.audio = !T.audio; sync(); T.start(); };
  el.querySelector(".fs").onclick = e => {
    e.stopPropagation();
    if (document.fullscreenElement) document.exitFullscreen(); else (el.requestFullscreen || el.webkitRequestFullscreen)?.call(el);
  };
  // PTZ: hold an arrow to move, release to stop
  if (c.ptz && ME && ME.ptz) {
    pBtn.style.display = "";

    el.querySelectorAll(".ptz button").forEach(b => {
      let timer = null, active = false;
      const go = e => {
        e.preventDefault(); e.stopPropagation(); if (active) return; active = true; b.classList.add("press");
        const send = () => ptzSend(c.id, { x: +b.dataset.x * 0.6, y: +b.dataset.y * 0.6 }).catch(stop);
        send(); timer = setInterval(send, 1500);
      };
      const stop = e => {
        if (e) { e.preventDefault(); e.stopPropagation(); }
        if (!active) return; active = false; b.classList.remove("press"); clearInterval(timer);
        ptzSend(c.id, { stop: true }).catch(() => {});
      };
      b.addEventListener("pointerdown", go); b.addEventListener("pointerup", stop);
      b.addEventListener("pointerleave", stop); b.addEventListener("pointercancel", stop);
      b.addEventListener("click", e => e.stopPropagation());
    });
  }
  el.onclick = () => { focused = focused === c.id ? null : c.id; layout(); };

}

function renderGrid() {
  const grid = $("#grid"), visible = CAMS.filter(c => enabled[c.id]);

const gb = b => (b / 1024 ** 3).toFixed(b > 100 * 1024 ** 3 ? 0 : 1) + " GB";
function setPill(id, cls, text) { const p = $(id); p.firstChild.className = "dot " + cls; p.lastChild.textContent = text; }
async function refreshStatus() {

    else if (st.mode) setPill("#stStorage", "warn", st.ejected && st.ssd_present ? t("ssdEjectedPill")
      : `💳 ${t("sdCard")} · ${gb(Math.max(0, st.sd_buffer_cap - st.sd_buffer_bytes))} ${t("free")}`);

    if (s.load !== null && s.cpus) { const pct = Math.round(100 * s.load / s.cpus); setPill("#stLoad", pct < 70 ? "ok" : pct < 95 ? "warn" : "bad", `CPU ${pct}%`); }

/* ============================ recordings ============================ */
const pad = n => String(n).padStart(2, "0");
const hms = (sec, s = true) => { sec = Math.max(0, Math.floor(sec)); return `${pad(Math.floor(sec / 3600))}:${pad(Math.floor(sec / 60) % 60)}${s ? ":" + pad(sec % 60) : ""}`; };
let TL = null, cur = null, selHour = null;          // timeline data, playing segment, selected hour
const pv = $("#pv");

async function loadTimeline(date, keepPos) {
  const cam = $("#recCam").value; if (!cam) return;
  let data;
  try { data = await api(`/api/timeline?cam=${encodeURIComponent(cam)}&date=${encodeURIComponent(date || "")}`); }
  catch (e) { $("#evs").innerHTML = `<p class="muted">${esc(e.message)}</p>`; return; }
  TL = data;
  const ds = $("#recDate"); ds.innerHTML = "";
  for (const d of data.dates.length ? data.dates : [data.date]) ds.add(new Option(d, d));
  ds.value = data.date;
  drawDay(); drawHours(); drawEvents();
  if (!keepPos) {
    const lastMotion = data.events.length ? data.events[data.events.length - 1] : null;
    const segs = data.segments;
    if (!segs.length) { selHour = null; drawStrip(); pv.removeAttribute("src"); pv.load(); $("#pvTime").textContent = "--:--:--"; $("#pvInfo").textContent = t("noRecs"); return; }
    const target = lastMotion ? lastMotion.start - 3 : segs[segs.length - 1].start;
    playAt(target, false);
  } else { drawStrip(); drawCursor(); }
}
const relSec = ts => ts - TL.day_start;
function drawDay() {
  const day = $("#day"); day.querySelectorAll(".seg,.ev,.cur,.now").forEach(e => e.remove());
  const pct = s => (100 * relSec(s) / 86400).toFixed(3) + "%";
  // merge contiguous segments into blocks (fewer DOM nodes)
  let blk = null; const blocks = [];
  for (const s of TL.segments) { if (blk && s.start - blk[1] < 15) blk[1] = s.end; else { blk = [s.start, s.end]; blocks.push(blk); } }
  for (const [a, b] of blocks) { const d = document.createElement("div"); d.className = "seg"; d.style.left = pct(a); d.style.width = `calc(${pct(b)} - ${pct(a)})`; day.appendChild(d); }
  for (const e of TL.events) {
    const d = document.createElement("div"); d.className = "ev"; const end = e.end ?? TL.now;
    d.style.left = pct(e.start); d.style.width = `max(2px, calc(${pct(end)} - ${pct(e.start)}))`; day.appendChild(d);
  }
  if (TL.now - TL.day_start < 86400) { const n = document.createElement("div"); n.className = "now"; n.style.left = pct(TL.now); day.appendChild(n); }
  const c = document.createElement("div"); c.className = "cur"; c.id = "cur"; c.style.display = "none"; day.appendChild(c);
}
function drawHours() { $("#hours").innerHTML = [0, 3, 6, 9, 12, 15, 18, 21, 24].map(h => `<span style="left:${100 * h / 24}%">${h === 24 ? "" : pad(h)}</span>`).join(""); }
function drawCursor() {
  const c = $("#cur"); if (!c || !cur) return;
  const ts = cur.start + (pv.currentTime || 0);
  c.style.display = ""; c.style.left = (100 * relSec(ts) / 86400) + "%";
  $("#pvTime").textContent = hms(relSec(ts));
}
function hourSegs(h) { return TL.segments.filter(s => Math.floor(relSec(s.start) / 3600) === h); }
function segHasMotion(s) { return TL.events.some(e => s.start < (e.end ?? TL.now) + 5 && s.end > e.start - 5); }
function drawStrip() {
  const hp = $("#hourpick"); hp.innerHTML = "";
  if (!TL.segments.length) { $("#strip").innerHTML = `<p class="muted">${t("noRecs")}</p>`; return; }
  for (let h = 0; h < 24; h++) {
    const segs = hourSegs(h); if (!segs.length) continue;
    const b = document.createElement("button"); b.textContent = pad(h) + ":00";
    b.className = "has" + (segs.some(segHasMotion) ? " mot" : "") + (h === selHour ? " on" : "");
    b.onclick = () => { selHour = h; drawStrip(); playSeg(segs[0], 0); };
    hp.appendChild(b);
  }
  const strip = $("#strip"); strip.innerHTML = "";
  if (selHour === null) return;
  for (const s of hourSegs(selHour)) {
    const b = document.createElement("button");
    b.className = "thumb" + (segHasMotion(s) ? " m" : "") + (cur && cur.url === s.url ? " sel" : "");
    b.innerHTML = (s.thumb ? `<img loading="lazy" src="${s.thumb}" alt="">` : `<div class="ph"></div>`) + `<span>${hms(relSec(s.start), false)}${s.done ? "" : " · " + t("live2")}</span>`;
    b.onclick = () => playSeg(s, 0);
    strip.appendChild(b);
  }
  const sel = strip.querySelector(".sel"); if (sel) sel.scrollIntoView({ block: "nearest", inline: "center" });
}
function drawEvents() {
  const box = $("#evs"); box.innerHTML = "";
  $("#evCount").textContent = TL.events.length ? `(${TL.events.length})` : "";
  if (!TL.events.length) { box.innerHTML = `<p class="muted">${t("noEvents")}</p>`; return; }
  for (const e of [...TL.events].reverse()) {
    const dur = Math.round((e.end ?? TL.now) - e.start);
    const b = document.createElement("button"); b.className = "evc";
    b.innerHTML = (e.pic ? `<img loading="lazy" src="${e.pic}" alt="">` : `<div class="ph"></div>`) +
      `<div><b>${hms(relSec(e.start))}</b> · ${e.live ? t("ongoing") : dur < 90 ? dur + " " + t("secs") : Math.round(dur / 60) + " " + t("mins")}</div>`;
    b.onclick = () => { playAt(e.start - 3, true); $("#recs").scrollTo({ top: 0, behavior: "smooth" }); };
    box.appendChild(b);
  }
}
function playAt(ts, autoplay) {
  const segs = TL.segments; if (!segs.length) return;
  let s = segs.find(x => ts >= x.start && ts < x.end);
  if (!s) { s = segs.find(x => x.start > ts) || segs[segs.length - 1]; ts = s.start; }
  playSeg(s, ts - s.start, autoplay);
}
function playSeg(s, offset, autoplay = true) {
  cur = s; selHour = Math.floor(relSec(s.start) / 3600);
  pv.src = s.url; $("#pvDl").href = s.url;
  pv.onloadedmetadata = () => { if (offset > 0.5) pv.currentTime = Math.min(offset, (pv.duration || 60) - 0.5); if (autoplay) pv.play().catch(() => {}); };
  $("#pvInfo").textContent = `${CAMS.find(c => c.id === TL.cam)?.name || ""} · ${TL.date}${segHasMotion(s) ? " · ⚠ motion" : ""}`;
  drawStrip(); drawCursor();
}
function nextSeg(dir) {
  if (!cur) return; const i = TL.segments.findIndex(x => x.url === cur.url), n = TL.segments[i + dir];
  if (n) playSeg(n, 0);
}
pv.addEventListener("timeupdate", drawCursor);
pv.addEventListener("ended", () => {                 // continue with the next minute
  const i = TL.segments.findIndex(x => x.url === cur.url), n = TL.segments[i + 1];
  if (n && n.start - cur.end < 15) playSeg(n, 0);
  else if (!cur.done) loadTimeline(TL.date, true).then(() => { const m = TL.segments.find(x => x.start > cur.start); if (m) playSeg(m, 0); });
});
$("#pvPrev").onclick = () => nextSeg(-1);
$("#pvNext").onclick = () => nextSeg(1);
(() => {
  const day = $("#day"), hov = $("#hov");
  const tsAt = e => { const r = day.getBoundingClientRect(); return TL.day_start + Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * 86400; };
  day.addEventListener("pointermove", e => {
    if (!TL) return; const ts = tsAt(e); hov.style.display = "block";
    hov.style.left = (100 * relSec(ts) / 86400) + "%"; hov.textContent = hms(relSec(ts), false);
  });
  day.addEventListener("pointerleave", () => hov.style.display = "none");
  day.addEventListener("click", e => {
    if (!TL || !TL.segments.length) return;
    const ts = tsAt(e), s = TL.segments.find(x => ts >= x.start - 30 && ts < x.end + 30);
    if (!s) { hov.style.display = "block"; hov.textContent = t("gap"); return; }
    playAt(ts, true);
  });
})();
function camSelect() {
  const sel = $("#recCam"), prev = sel.value || LS.get("cctv.recCam", ""); sel.innerHTML = "";

$("#recDate").onchange = () => loadTimeline($("#recDate").value);
$("#dPrev").onclick = () => { const o = $("#recDate"); if (o.selectedIndex < o.options.length - 1) { o.selectedIndex++; loadTimeline(o.value); } };

  main_path: $("#cMain").value.trim(), sub_path: $("#cSub").value.trim(), mode: $("#cMode").value,
  record_stream: $("#cRec").value, threshold: $("#cThr").value, enabled: $("#cEn").checked,
  audio: $("#cAud").checked, ptz: $("#cPtz").checked });
$("#cNew").onclick = () => editCam(null);
$("#cTest").onclick = async () => {
  const b = $("#cTest"); b.disabled = true; $("#cErr").textContent = "";
  $("#cRes").innerHTML = `<span class="muted">${t("testing")}</span>`;
  try {
    const r = await api("/api/admin/cameras/test", camForm());
    const line = (label, x) => x.ok ? `<span class="ok">✅ ${label}: ${esc(x.codec)} ${x.width}×${x.height}${x.codec === "hevc" ? t("hevcNote") : ""}</span>`
      : `<span class="no">❌ ${label}: ${esc(x.error)}</span>`;
    $("#cRes").innerHTML = line("Main", r.main) + (r.sub.same ? "" : line("Sub", r.sub));
  } catch (err) { $("#cRes").innerHTML = ""; $("#cErr").textContent = err.message; }
  b.disabled = false;
};
$("#cOnvif").onclick = async () => {
  const f = camForm(), box = $("#cPick"); $("#cErr").textContent = "";
  if (!f.host) { $("#cErr").textContent = t("needIp"); return; }
  box.innerHTML = `<span class="muted">${t("onvifSearching")}</span>`;
  try {
    const r = await api("/api/admin/cameras/onvif", { id: camEditing, host: f.host, user: f.user, password: f.password });
    const st = r.streams;
    box.innerHTML = `<span class="muted">${t("onvifFound", st.length, r.onvif_port)}</span>`;
    $("#cMain").value = st[0].path; $("#cPort").value = st[0].port; $("#cSub").value = st.length > 1 ? st[st.length - 1].path : "";
    for (const x of st) {
      const b = document.createElement("button"); b.type = "button"; b.title = t("useAsSub");
      b.textContent = `${x.name || "stream"} · ${x.width}×${x.height} ${x.encoding || ""} → ${x.path}`;
      b.onclick = () => { $("#cSub").value = x.path; }; box.appendChild(b);
    }
  } catch (err) { box.innerHTML = ""; $("#cErr").textContent = err.message; }
};
async function waitApply(since) {
  const ban = $("#applyBanner"); ban.style.display = "block"; ban.textContent = t("applying");
  for (let i = 0; i < 30; i++) {
    await new Promise(r => setTimeout(r, 1000));
    let a = {}; try { a = await api("/api/admin/apply"); } catch {}
    if (a.time && a.time >= Math.floor(since)) {
      ban.textContent = a.ok ? t("applied") + tr(a.message) : "❌ " + tr(a.message);
      setTimeout(() => ban.style.display = "none", 6000); await refreshCams(); return;
    }
  }
  ban.textContent = t("applySlow");
}
async function refreshCams() {
  try { CAMS = await api("/api/cameras"); } catch { return; }
  for (const c of CAMS) if (!(c.id in enabled)) enabled[c.id] = true;
  for (const [id, T] of tiles) { T.player.stop(); T.el.remove(); tiles.delete(id); }
  $("#grid").innerHTML = ""; saveEnabled(); renderChips(); renderGrid();
  if (!liveTab) for (const T of tiles.values()) T.player.stop();
  loadCamCfg(); resetUserForm(null);
}
$("#cForm").onsubmit = async e => {
  e.preventDefault(); $("#cErr").textContent = "";
  try { const r = await api("/api/admin/cameras/save", camForm()); editCam(null); await loadCamCfg(); waitApply(r.requested); }
  catch (err) { $("#cErr").textContent = err.message; }
};
$("#cDel").onclick = async () => {
  if (!camEditing || !confirm(t("delCamQ"))) return;
  try { const r = await api("/api/admin/cameras/delete", { id: camEditing }); editCam(null); await loadCamCfg(); waitApply(r.requested); }
  catch (err) { $("#cErr").textContent = err.message; }
};

/* =========================== google drive =========================== */
let DRV = null;
function showDrive(d) {
  DRV = d; const st = $("#drvState");
  if (d.configured) {
    let txt = t("drvOk", esc((d.remote || "").split(":")[1] || "CCTV"), esc(d.max_gb));
    if (d.about && d.about.total) { const g = b => (b / 1024 ** 3).toFixed(1); txt += "<br>" + t("drvSpace", g(d.about.used), g(d.about.total), g(d.about.free ?? (d.about.total - d.about.used))); }
    if (d.ok === false) txt += `<br><span style="color:var(--bad)">❌ ${esc(d.error)}</span>`;
    st.innerHTML = txt;
  } else st.textContent = t("drvNot");
  $("#drvStart").textContent = d.configured ? t("drvOther") : t("drvConnect");
  $("#drvCheck").style.display = $("#drvOff").style.display = d.configured ? "" : "none";
}
async function loadDrive(check) { try { showDrive(await api("/api/admin/drive" + (check ? "?check=1" : ""))); } catch (e) { $("#drvErr").textContent = e.message; } }
$("#drvStart").onclick = async () => {
  $("#drvErr").textContent = ""; $("#drvStart").disabled = true;
  try { const r = await api("/api/admin/drive/start", {}); $("#drvGo").href = r.url; $("#drvSteps").style.display = "block"; $("#drvUrl").value = ""; }
  catch (e) { $("#drvErr").textContent = e.message; }
  $("#drvStart").disabled = false;
};
$("#drvFinish").onclick = async () => {
  $("#drvErr").textContent = ""; const b = $("#drvFinish"); b.disabled = true; b.textContent = t("drvConnecting");
  try { showDrive(await api("/api/admin/drive/finish", { url: $("#drvUrl").value })); $("#drvSteps").style.display = "none"; }
  catch (e) { $("#drvErr").textContent = e.message; }
  b.disabled = false; b.textContent = t("drvFinish");
};
$("#drvCheck").onclick = async () => { $("#drvState").textContent = t("drvTesting"); await loadDrive(true); };
$("#drvOff").onclick = async () => { if (!confirm(t("drvOffQ"))) return; showDrive(await api("/api/admin/drive/disconnect", {})); };

/* ============================= storage ============================= */
async function showStorage() {
  let d; try { d = await api("/api/storage"); } catch { return; }
  const st = d.storage || {}, admin = ME && ME.role === "admin";
  const barH = (used, total) => `<div class="bar"><i style="width:${total ? Math.min(100, 100 * used / total).toFixed(1) : 0}%"></i></div>`;
  let h = t("recTo", st.mode === "ssd" ? "💾 SSD" : "💳 " + t("sdCard")) + "<br>";
  if (st.mode === "ssd") {
    h += t("ssdLine", gb(st.avail), gb(st.total)) + barH(st.used, st.total);
    h += t("cctvFolder", gb(st.rec_bytes || 0), st.ssd_cap ? gb(st.ssd_cap) : "–") + "<br>";
  } else {
    h += t("sdLine", gb(st.sd_buffer_bytes || 0), gb(st.sd_buffer_cap || 0)) + barH(st.sd_buffer_bytes, st.sd_buffer_cap);
    h += `<span class="muted">${st.ejected && st.ssd_present ? t("ejectedNote") : t("sdNote")}</span>`;
  }
  $("#stBody").innerHTML = h;
  $("#ejBtn").style.display = admin && st.mode === "ssd" ? "" : "none";
  $("#atBtn").style.display = admin && st.mode !== "ssd" && st.ejected && st.ssd_present ? "" : "none";
  if (!$("#stDlg").open) { $("#ejMsg").textContent = ""; $("#stDlg").showModal(); }
}
async function ssdAction(kind) {
  const b = kind === "eject" ? $("#ejBtn") : $("#atBtn"); b.disabled = true;
  $("#ejMsg").textContent = t("ejecting");
  let before = 0; try { before = ((await api("/api/storage")).eject || {}).time || 0; } catch {}
  try { await api("/api/admin/ssd/" + kind, {}); } catch (e) { $("#ejMsg").textContent = e.message; b.disabled = false; return; }
  for (let i = 0; i < 40; i++) {
    await new Promise(r => setTimeout(r, 1500));
    let d; try { d = await api("/api/storage"); } catch { continue; }
    const e = d.eject || {};
    if (e.time > before && e.state !== "working") { $("#ejMsg").textContent = (e.state === "ok" ? "✅ " : "❌ ") + tr(e.message); break; }
  }
  b.disabled = false; refreshStatus(); showStorage();
}
$("#stStorage").onclick = showStorage;
$("#ejBtn").onclick = () => { if (confirm(t("ejectQ"))) ssdAction("eject"); };
$("#atBtn").onclick = () => ssdAction("attach");

/* ============================== system ============================== */
async function loadSys() {
  let u = {}; try { u = await api("/api/admin/update"); } catch {}
  $("#sysPub").innerHTML = u.public_url ? `${t("pubOn")}<a href="${esc(u.public_url)}" style="color:var(--blue)">${esc(u.public_url)}</a>` : t("pubOff");
  const when = u.time ? new Date(u.time * 1000).toLocaleString() : "";
  $("#sysVer").textContent = u.version ? `${u.version} · ${tr(u.message || "")}${when ? ` · ${t("checked")}: ${when}` : ""}` : t("noAutoUpd");
  return u;
}
async function runUpdate(b, label) {
  b.disabled = true; const old = b.textContent; b.textContent = t("checking");
  const before = (await loadSys()).time || 0;
  try { await api("/api/admin/update", {}); } catch (err) { alert(err.message); }
  let res = null;
  for (let i = 0; i < 90; i++) {
    await new Promise(r => setTimeout(r, 2000));
    let u; try { u = await api("/api/admin/update"); } catch { continue; }     // server restarts while updating
    if (u.time > before && u.state !== "updating") { res = u; break; }
  }
  b.disabled = false; b.textContent = label ? t(label) : old;
  if (res && /^Updated/.test(res.message || "")) { location.reload(); return; }
  if (res && res.state === "error") alert(t("updFailed") + tr(res.message));
  else if (res) alert(t("upToDate"));
  loadSys();
}
$("#sysUpd").onclick = () => runUpdate($("#sysUpd"), "checkUpdate");
$("#mUpd").onclick = e => { e.stopPropagation(); $("#menu").style.display = "none"; runUpdate($("#mUpd"), "updateNow"); };

/* =========================== users (admin) =========================== */
let editing = null, formRole = "viewer";
function setRole(r) {
  formRole = r;
  $("#uRole").querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.r === r));
  $("#uViewerOpts").style.display = r === "admin" ? "none" : "block";
}
$("#uRole").querySelectorAll("button").forEach(b => b.onclick = () => setRole(b.dataset.r));
function resetUserForm(u) {
  if (!ME || ME.role !== "admin") return;
  editing = u ? u.name : null;
  $("#uFormTitle").textContent = u ? t("editUser", u.name) : t("newUser");
  $("#uName").value = u ? u.name : ""; $("#uName").disabled = !!u;
  $("#uPass").value = ""; $("#uPassLbl").textContent = u ? t("newPassOpt") : t("password");
  $("#uRecs").checked = u ? u.recordings : true; $("#uPtz").checked = u ? !!u.ptz : false;
  const box = $("#uCams"); box.innerHTML = "";
  for (const c of CAMS) {
    const l = document.createElement("label"), ok = !u || u.cameras === "*" || u.cameras.includes(c.id);
    l.innerHTML = `<input type="checkbox" value="${esc(c.id)}" ${ok ? "checked" : ""}> <span></span>`; l.lastChild.textContent = c.name; box.appendChild(l);
  }
  setRole(u ? u.role : "viewer"); $("#uErr").textContent = "";
}
async function loadUsers() {
  const list = await api("/api/users"), box = $("#ulist"); box.innerHTML = "";
  for (const u of list) {
    const row = document.createElement("div"); row.className = "urow";
    const camsTxt = u.cameras === "*" ? t("allCams") : (u.cameras.map(id => (CAMS.find(c => c.id === id) || {}).name || id).join(", ") || t("noneCams"));
    row.innerHTML = `<div><b></b> <span class="role ${u.role}">${u.role}</span><small></small></div>
      <div style="display:flex;gap:6px"><button class="btn ghost">Edit</button><button class="btn danger">${t("delete")}</button></div>`;
    row.querySelector("b").textContent = u.name;
    row.querySelector("small").textContent = u.role === "admin" ? t("adminDesc")
      : `${camsTxt} · recordings: ${u.recordings ? t("yes") : t("no")} · PTZ: ${u.ptz ? t("yes") : t("no")}`;
    const [eb, db] = row.querySelectorAll("button");
    eb.onclick = () => { resetUserForm(u); $("#uForm").scrollIntoView({ behavior: "smooth" }); };
    db.onclick = async () => { if (!confirm(t("delUserQ", u.name))) return; try { await api("/api/users/delete", { name: u.name }); loadUsers(); } catch (err) { alert(err.message); } };
    box.appendChild(row);
  }
}
$("#uCancel").onclick = () => resetUserForm(null);
$("#uForm").onsubmit = async e => {
  e.preventDefault(); $("#uErr").textContent = "";
  const cams = [...$("#uCams").querySelectorAll("input:checked")].map(i => i.value);
  const body = { name: editing || $("#uName").value.trim(), role: formRole, recordings: $("#uRecs").checked, ptz: $("#uPtz").checked,
    cameras: formRole === "admin" || cams.length === CAMS.length ? "*" : cams };
  if ($("#uPass").value) body.password = $("#uPass").value;
  try { await api("/api/users/save", body); if (editing === ME.name) { location.reload(); return; } resetUserForm(null); loadUsers(); }
  catch (err) { $("#uErr").textContent = err.message; }
};

/* ======================== re-render on language ======================== */
function rerenderAll() {
  for (const T of tiles.values()) T.sync();
  if (!CAMS.length || !CAMS.some(c => enabled[c.id])) renderGrid();
  refreshStatus();
  if (curTab === "recs" && TL) { drawStrip(); drawEvents(); }
  if (curTab === "users") { loadUsers(); loadSys(); if (DRV) showDrive(DRV); loadCamCfg(); $("#cFormTitle").textContent = camEditing ? t("editCam", $("#cName").value) : t("newCam"); resetUserForm(null); }
}

/* ================================ boot ================================ */
applyLang();
(async () => {
  const r = await fetch("/api/me", { cache: "no-store", headers: { "X-Lang": LANG } });
  const me = await r.json().catch(() => ({}));
  if (r.status === 401) { showLogin(!!me.needs_setup); return; }
  ME = me;
  if (!LS.get("cctv.lang", null) && me.lang && me.lang !== LANG) { LANG = me.lang; applyLang(); }
  $("#meName").textContent = me.name; $("#meRole").textContent = me.role; $("#meRole").className = "role " + me.role;
  if (!me.recordings) $("#tabRecs").style.display = "none";
  if (me.role === "admin") { $("#tabUsers").style.display = ""; $("#mUpd").style.display = ""; }
  try { CAMS = await api("/api/cameras"); } catch { CAMS = []; }
  if (!enabled) enabled = {};
  for (const c of CAMS) if (!(c.id in enabled)) enabled[c.id] = true;
  saveEnabled(); renderChips(); renderGrid();
  if (me.role === "admin") resetUserForm(null);
  refreshStatus(); setInterval(refreshStatus, 15000);
  pollMotion(); setInterval(pollMotion, 3000);
})();
</script>
</body>
